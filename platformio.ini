[env:pico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = olimex_pico2xl
framework = arduino
board_build.core = earlephilhower
board_build.f_cpu = 200000000L
upload_protocol = picotool
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    ; SD comes bundled with earlephilhower core; listed here for clarity.
    SD
    SPI

; -------------------------------------------------------------------
; Pico2Arcade — port of Till Harbaum's Galagino arcade emulator
; (Pac-Man / Galaga / DKong / Frogger / Digdug / 1942) from ESP32 to
; the PicoCartReader hardware (RP2350B + ST7789 + PCA9539 + JoyCon).
;
; Source of truth: upstream/galagino/  (git submodule / clone).
; ESP32-specific bits (video.cpp using ESP-IDF SPI, I2S audio,
; Nunchuck I2C) are STUBBED and rewritten under src/pico_glue/.
; -------------------------------------------------------------------

build_flags =
    -Os
    -DPICO_GALAGINO_BUILD=1
    ; Uncomment to run the display in landscape 320x240 with a 6:5
    ; downscale of the 288-row game framebuffer to 240 rows.
    ; Costs ~108 KB extra RAM for the scaled buffer.
    -DPICO_GALAGINO_LANDSCAPE=1
    ; Nearest-neighbour drop-every-6th-row instead of bilinear blend.
    ; Basically free (memcpys only) vs ~5 ms/frame for the blend.
    ; Sharper but slightly jittery on horizontal lines.
    -DPICO_GALAGINO_LANDSCAPE_NEAREST=1
    ; Also do 6:5 horizontal drop (224 → 186 columns). Restores the
    ; original 224/288 aspect ratio that pure vertical downscale
    ; stretches. Only meaningful when both LANDSCAPE + NEAREST are set.
    -DPICO_GALAGINO_LANDSCAPE_HSCALE=1
    ; Multi-machine: both Pac-Man and Galaga enabled. Our menu runs
    ; first (via g_menu_done gate) and sets `machine` before core 1
    ; starts emulation, which prevents Galagino's built-in menu from
    ; activating (its emulate_frame/render_line checks are gated on
    ; machine == MCH_MENU).
    ; TFT_eSPI config (mirrors PicoCartReader — same panel)
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_INVERSION_OFF=1
    -DTFT_SPI_MODE=SPI_MODE0
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=-1
    -DTFT_MOSI=7
    -DTFT_SCLK=6
    -DTFT_CS=5
    -DTFT_DC=8
    -DTFT_RST=9
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DSPI_FREQUENCY=100000000
    ; SD card on SPI1 (separate bus from the TFT on SPI0)
    -DSD_CS_PIN=13
    -DSD_SCK_PIN=10
    -DSD_MOSI_PIN=11
    -DSD_MISO_PIN=12
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_PORT=0
    -Isrc
    -Isrc/uzlib
    -Wno-unused-variable
    -Wno-unused-but-set-variable
    -Wno-missing-braces
    -Wno-sign-compare
    ; Z80 CPU core: superzazu/z80 (MIT) with the Galagino patches — see
    ; src/z80_core.h and src/z80_zazu/.
    -DZ80_CORE_ZAZU
    -DZ80_ZAZU_GALAGINO

build_src_flags =
    -Wno-implicit-function-declaration
    -Wno-incompatible-pointer-types
    -Wno-implicit-int

build_src_filter =
    +<*>

; Installs the custom ST7789 init overlay into this env's TFT_eSPI copy.
extra_scripts = pre:tft_overlay.py

; -------------------------------------------------------------------
; Arcade mode: same build, but `pio run -e pico2_arcade -t upload`
; flashes into the arcade window (0x201000) of the PicoCartReader
; board so its ARCADE menu tile can chain-boot this image. The CartReader
; firmware in the lower 2 MB is left intact. See arcade_upload.py.
; (Plain `-e pico2 -t upload` still flashes standalone at offset 0,
; which OVERWRITES the CartReader.)
; -------------------------------------------------------------------
[env:pico2_arcade]
extends = env:pico2
extra_scripts =
    pre:tft_overlay.py
    post:arcade_upload.py

; -------------------------------------------------------------------
; Z80 benchmark (src/pico_bench.*): skips the menu, runs BENCH_GAME in
; attract mode (30 s warm-up + 30 s measured) with input forced off, and
; writes per-frame CPU time + RAM hashes to /bench_zazu.log on the SD
; card. Uploads into the arcade window like pico2_arcade.
; -------------------------------------------------------------------
[env:bench]
extends = env:pico2_arcade
build_flags =
    ${env:pico2.build_flags}
    -DZ80_BENCH
    -DBENCH_GAME=galaga

; -------------------------------------------------------------------
; Quad Ultimate CX arcade image (GameAdapterRGBPico MODEL_QUAD, 4 MB).
; Chain-booted by the Quad firmware from its arcade slot at 0x270000
; (Quad 1.1; 0x360000 on 1.0) (Mini-Games > Arcade Games); the same window
; maps the Quad's 512 KB FAT12 ROM drive (0x380000, window offset 0x110000;
; 1.0: 256 KB right after this image), where the ROM zips are read
; from (src/pico_romfs.cpp) instead of an SD card. Quad pins: port 1
; DB9 + device buttons (src/pico_board.cpp), backlight on GPIO23, always
; landscape. Must stay <= 380 KB (the 384 KB slot minus its last 4 KB,
; which holds the high scores — src/pico_hiscore.cpp; on Quad 1.1 they
; are the sector below the drive, 0x37F000, but the limit stays).
; `pio run -e quad -t upload` writes the .bin to 0x10270000 (arcade
; slot only — the Quad firmware and ROM drive are left alone).
; -------------------------------------------------------------------
[env:quad]
extends = env:pico2
build_flags =
    ${env:pico2.build_flags}
    -DPICO_QUAD
    ; ST7789 backlight MOSFET — TFT_eSPI switches it on in init()
    -DTFT_BL=23
    -DTFT_BACKLIGHT_ON=HIGH
    ; Fallbacks if the Quad didn't pass the ROM drive location (scratch[0]/[2]/[3])
    -DPICO_HOST_FAT_WINDOW_OFS=0x110000
    -DPICO_HOST_FAT_PHYS=0x380000
    ; USB ROM drive mode (src/pico_drive.cpp) needs the TinyUSB stack
    -DUSE_TINYUSB
    -DPICO_HOST_FAT_SIZE=0x80000
extra_scripts =
    pre:tft_overlay.py
    post:arcade_upload.py
custom_arcade_offset = 0x10270000
; USB ROM drive mode is in here too (TinyUSB, ~84 KB) — the reason the slot
; grew from 320 KB at 0x370000 to 384 KB at 0x360000 (GameAdapterRGBPico
; include/arcade.hpp).

; -------------------------------------------------------------------
; Duo 5200 Ultimate arcade image (GameAdapterRGBPico MODEL_5200, 4 MB).
; Chain-booted from its arcade slot at 0x300000 (384 KB, last 4 KB = high
; scores); the 512 KB "ARCADE ROMS" drive follows at 0x360000 (window offset
; 0x60000) — big enough for every supported game's zip — ending below the
; 5200 firmware's LittleFS/EEPROM, which stay where 5200 1.0 put them. Same panel, Joy-Con, buttons, audio and backlight as the
; Quad; controls also read the port 1 Atari 5200 controller (src/pico_board.cpp).
; `pio run -e duo5200 -t upload` writes only the arcade slot.
; -------------------------------------------------------------------
[env:duo5200]
extends = env:pico2
build_flags =
    ${env:pico2.build_flags}
    -DPICO_5200
    -DTFT_BL=23
    -DTFT_BACKLIGHT_ON=HIGH
    -DPICO_HOST_FAT_WINDOW_OFS=0x60000
    -DPICO_HOST_FAT_PHYS=0x360000
    -DPICO_HOST_FAT_SIZE=0x80000
    -DUSE_TINYUSB
extra_scripts =
    pre:tft_overlay.py
    post:arcade_upload.py
custom_arcade_offset = 0x10300000

; -------------------------------------------------------------------
; Standalone arcade on a plain Raspberry Pi Pico 2 (RP2350A, 4 MB) +
; ST7789 240x320 SPI display. Flash layout: firmware from 0, 1 MB FAT12
; "ARCADE ROMS" drive at 0x200000 (src/pico_romfs.cpp), settings sector
; at 0x300000 (src/pico_config.cpp). Button / stick / audio pins come from
; ARCADE.INI on that drive (src/pico_board.cpp; defaults written on first
; format). USB ROM drive mode (src/pico_drive.cpp): first boot, MENU held
; at power-on, or the menu's "ROM Drive (USB)" row.
; Flash with the UF2 (BOOTSEL) or `pio run -e pico2_std -t upload`.
; -------------------------------------------------------------------
[env:pico2_std]
extends = env:pico2
board = rpipico2
build_flags =
    ${env:pico2.build_flags}
    -DPICO_STANDALONE
    -DUSE_TINYUSB

; -------------------------------------------------------------------
; Standalone Pico 2 with an ILI9341 240x320 SPI display (the common red
; 2.4" / 2.8" modules) instead of the ST7789. Same pins and everything
; else as pico2_std; TFT_eSPI picks the driver at compile time, hence a
; separate image. SPI at 50 MHz (the ILI9341 is rated far below the
; ST7789's 100 MHz; the RP2350 at 200 MHz can do 100 or 50, not in
; between) — still well inside the 30 fps screen budget.
; -------------------------------------------------------------------
[env:pico2_std_ili9341]
extends = env:pico2_std
build_unflags =
    -DST7789_DRIVER=1
    -DSPI_FREQUENCY=100000000
build_flags =
    ${env:pico2_std.build_flags}
    -DILI9341_DRIVER=1
    -DSPI_FREQUENCY=50000000
